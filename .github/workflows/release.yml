name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Install Inno Setup
        run: choco install innosetup -y

      # Защита от «забыл поднять версию»: тег обязан совпадать с APP_VERSION.
      - name: Check version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (& python tools\make_version_info.py).Trim()
          if ($ver -ne $tag) {
            throw "APP_VERSION ($ver) не совпадает с тегом ($tag) — поднимите версию в app/version.py"
          }

      - name: Build exe + installer + portable zip
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_installer.ps1

      # В тело релиза идёт ровно одна строка: сумма УСТАНОВЩИКА — именно его
      # скачивает апдейтер (стратегия B). Голый exe отдельным ассетом больше
      # не публикуется: апдейтер ищет установщик по имени.
      - name: Prepare release notes
        shell: pwsh
        run: |
          $ver = (& python tools\make_version_info.py).Trim()
          $setup = Get-ChildItem "dist-installer\Nodexy-Setup-$ver.exe"
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "sha256: $sha" | Set-Content release_body.txt -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.txt
          files: |
            dist-installer/Nodexy-Setup-*.exe
            dist-installer/Nodexy-portable-*.zip
